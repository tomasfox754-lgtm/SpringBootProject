# NOMBRE Y PUERTO
spring.application.name=logitrack
server.port=8080

# ACTIVAR MYSQL EN LUGAR DEL MODO DEMO
spring.profiles.active=mysql

# CONEXION A MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack?serverTimezone=America/Bogota
spring.datasource.username=logitrack
spring.datasource.password=LogitrackLocal123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# VALIDAR LAS TABLAS QUE CREAMOS MANUALMENTE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# NO VOLVER A EJECUTAR LOS SCRIPTS AUTOMATICAMENTE
spring.sql.init.mode=never

# CONFIGURACION JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=America/Bogota

# JWT: CLAVE DE EJEMPLO PARA PRACTICA LOCAL
jwt.secret=clave-local-logitrack-para-pruebas-1234567890
jwt.expiration-ms=3600000

# ADMINISTRADOR INICIAL DE LA APLICACION
app.admin.username=admin
app.admin.password=Admin12345!

# SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html